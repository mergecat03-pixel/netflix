<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFTOKEN Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a12;
            --bg-card: #12121f;
            --border-color: #2a2a3e;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --text-muted: #555577;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --success: #10b981;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-wrapper { max-width: 500px; width: 100%; margin: 0 auto; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-icon {
            width: 36px; height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .header-title { font-size: 1.2rem; font-weight: 800; }
        .header-title span { color: var(--accent); }
        .btn-icon {
            background: transparent; border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-icon:hover { color: white; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 16px;
        }

        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 6px;
        }
        .input-group select, .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
            outline: none;
            appearance: none;
        }
        .input-group select option { background: var(--bg-card); color: white; }
        .input-group select:focus, .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: white;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-generate .loader { display: none; animation: spin 0.8s linear infinite; }
        .btn-generate.loading .loader { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-container { margin-top: 14px; display: none; }
        .progress-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .progress-message {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: center;
        }

        .result-card { display: none; }
        .result-card.show { display: block; }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            gap: 8px;
            flex-wrap: wrap;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .label { color: var(--text-secondary); font-size: 0.75rem; }
        .result-item .value {
            font-weight: 600;
            font-size: 0.7rem;
            word-break: break-all;
            text-align: right;
            max-width: 55%;
        }
        .result-item .value.url { color: #a78bfa; font-size: 0.65rem; }
        .result-item .value.plan-premium { color: #f59e0b; }
        .result-item .value.plan-standard { color: #60a5fa; }
        .result-item .value.plan-basic { color: #34d399; }
        .copy-btn-sm {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 2px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.6rem;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
        }
        .copy-btn-sm:hover { background: rgba(255,255,255,0.1); color: white; }
        .copy-btn-sm.copied {
            background: rgba(16,185,129,0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 100;
            box-shadow: var(--shadow);
            max-width: 90%;
        }
        .toast.show { display: flex; animation: toastIn 0.3s ease; }
        .toast i { color: var(--success); font-size: 1.1rem; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 10px 0 4px;
        }
        .footer i { color: #ef4444; }

        @media (max-width: 420px) {
            body { padding: 10px; }
            .card { padding: 16px; }
            .btn-generate { font-size: 1rem; padding: 14px; }
            .result-item .value { max-width: 100%; text-align: left; }
            .result-item { flex-wrap: wrap; gap: 4px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <header class="header">
            <div class="header-left">
                <div class="header-icon"><i class="ri-flashlight-fill"></i></div>
                <div class="header-title">NFT<span>OKEN</span></div>
            </div>
            <div class="header-right">
                <button class="btn-icon" onclick="showToast('NFTOKEN Scraper v1.0')"><i class="ri-information-line"></i></button>
            </div>
        </header>

        <div class="card">
            <div class="input-group">
                <label><i class="ri-stack-line"></i> Jumlah Token</label>
                <input type="number" id="countInput" value="5" min="1" max="50">
            </div>

            <div class="input-group">
                <label><i class="ri-list-check"></i> Plan</label>
                <select id="planSelect">
                    <option value="">Auto (Bergantian)</option>
                    <option value="premium">⭐ Premium</option>
                    <option value="standard">📦 Standard</option>
                    <option value="basic">🔹 Basic</option>
                </select>
            </div>

            <button class="btn-generate" id="generateBtn" onclick="startGenerate()">
                <i class="ri-rocket-2-fill"></i>
                <span class="btn-text">Generate Token</span>
                <i class="ri-loader-4-line loader"></i>
            </button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-message" id="progressMessage">Menunggu...</div>
            </div>
        </div>

        <div class="card result-card" id="resultCard">
            <div id="resultContent"></div>
        </div>

        <div class="footer">
            Made with <i class="ri-heart-fill"></i> by <strong>Kaze</strong>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="ri-checkbox-circle-fill"></i>
        <span id="toastMsg">Berhasil!</span>
    </div>

    <script>
        let isRunning = false;
        let statusInterval = null;

        const generateBtn = document.getElementById('generateBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressMessage = document.getElementById('progressMessage');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function copyText(text, btnElement) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                if (btnElement) {
                    btnElement.textContent = '✅ Copied!';
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.textContent = '📋 Copy';
                        btnElement.classList.remove('copied');
                    }, 2000);
                }
                showToast('✅ Disalin!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                if (btnElement) {
                    btnElement.textContent = '✅ Copied!';
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.textContent = '📋 Copy';
                        btnElement.classList.remove('copied');
                    }, 2000);
                }
                showToast('✅ Disalin!');
            });
        }

        function updateStatus() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    if (data.running) {
                        const pct = Math.min(100, Math.round((data.progress || 0) / (data.total || 1) * 100));
                        progressBar.style.width = pct + '%';
                        progressMessage.textContent = data.message || `Memproses ${data.progress}/${data.total}`;
                        
                        if (data.results && data.results.length > 0) {
                            showResults(data.results);
                        }
                    } else {
                        // Selesai
                        if (statusInterval) {
                            clearInterval(statusInterval);
                            statusInterval = null;
                        }
                        generateBtn.disabled = false;
                        generateBtn.classList.remove('loading');
                        generateBtn.innerHTML = '<i class="ri-rocket-2-fill"></i><span class="btn-text">Generate Token</span>';
                        isRunning = false;
                        
                        if (data.results && data.results.length > 0) {
                            showResults(data.results);
                            progressMessage.textContent = `✅ Selesai! ${data.results.length} token`;
                            showToast(`✅ ${data.results.length} token berhasil!`);
                        }
                    }
                })
                .catch(err => {
                    console.error('Status error:', err);
                });
        }

        function showResults(results) {
            resultCard.classList.add('show');
            let html = '';

            results.forEach((r, idx) => {
                const planClass = r.plan === 'premium' ? 'plan-premium' : r.plan === 'standard' ? 'plan-standard' : 'plan-basic';
                const planIcon = r.plan === 'premium' ? '⭐' : r.plan === 'standard' ? '📦' : '🔹';
                html += `
                    <div class="result-item">
                        <span class="label">#${idx + 1} ${planIcon} ${r.plan}</span>
                        <span class="value url">${r.url}</span>
                        <button class="copy-btn-sm" onclick="copyText('${r.url}', this)">📋 Copy</button>
                    </div>
                    <div style="font-size:0.6rem;color:#555577;padding-left:8px;margin-bottom:6px;">
                        Exp: ${r.expires || '-'} | ${r.quality || '-'} | ${r.country || '-'}
                    </div>
                `;
            });

            resultContent.innerHTML = html;
        }

        function startGenerate() {
            if (isRunning) {
                showToast('⚠️ Proses sedang berjalan');
                return;
            }

            const count = parseInt(document.getElementById('countInput').value) || 5;
            const plan = document.getElementById('planSelect').value || null;

            if (count < 1 || count > 50) {
                showToast('⚠️ Jumlah token 1-50');
                return;
            }

            isRunning = true;
            generateBtn.disabled = true;
            generateBtn.classList.add('loading');
            generateBtn.innerHTML = '<i class="ri-loader-4-line loader" style="display:inline-block;"></i><span class="btn-text">Memproses...</span>';

            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressMessage.textContent = 'Memulai...';
            resultCard.classList.remove('show');

            fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count, plan })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('✅ Proses dimulai!');
                    if (statusInterval) clearInterval(statusInterval);
                    statusInterval = setInterval(updateStatus, 2000);
                    setTimeout(updateStatus, 500);
                } else {
                    showToast('❌ ' + data.error);
                    generateBtn.disabled = false;
                    generateBtn.classList.remove('loading');
                    generateBtn.innerHTML = '<i class="ri-rocket-2-fill"></i><span class="btn-text">Generate Token</span>';
                    isRunning = false;
                }
            })
            .catch(err => {
                showToast('❌ Error: ' + err.message);
                generateBtn.disabled = false;
                generateBtn.classList.remove('loading');
                generateBtn.innerHTML = '<i class="ri-rocket-2-fill"></i><span class="btn-text">Generate Token</span>';
                isRunning = false;
            });
        }

        console.log('🚀 NFTOKEN Scraper loaded!');
    </script>

</body>
    </html>
